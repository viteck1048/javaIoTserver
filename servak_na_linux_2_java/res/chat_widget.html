<style>#chat-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:#3498db;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:10000;transition:opacity .2s;user-select:none;-webkit-user-select:none}#chat-fab:hover{transform:scale(1.05)}#chat-fab.hidden{opacity:0;pointer-events:none}#chat-fab svg{width:28px;height:28px;fill:#fff;pointer-events:none}#chat-window{position:fixed;bottom:90px;right:24px;width:320px;height:420px;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.25);display:flex;flex-direction:column;z-index:10000;overflow:hidden;opacity:0;transform:scale(.8) translateY(20px);pointer-events:none;transition:opacity .25s,transform .25s}#chat-window.open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}#chat-bar{background:#3498db;color:#fff;padding:10px 14px;font-size:14px;font-weight:600;cursor:grab;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}#chat-bar:active{cursor:grabbing}#chat-bar .close-hint{font-size:11px;font-weight:400;opacity:.8}#chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f5f7fa}#chat-messages .msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.4;word-wrap:break-word}#chat-messages .msg.user{align-self:flex-end;background:#3498db;color:#fff;border-bottom-right-radius:4px}#chat-messages .msg.assistant{align-self:flex-start;background:#fff;color:#333;border:1px solid #e0e0e0;border-bottom-left-radius:4px}#chat-messages .msg.error{align-self:center;background:#fee;color:#c00;border:1px solid #fcc;font-size:12px}#chat-input-area{display:flex;padding:8px;gap:6px;background:#fff;border-top:1px solid #e0e0e0;flex-shrink:0}#chat-input{flex:1;border:1px solid #ccc;border-radius:20px;padding:8px 14px;font-size:13px;outline:none;resize:none;font-family:inherit;max-height:80px;overflow-y:auto}#chat-input:focus{border-color:#3498db}#chat-send{width:40px;height:40px;border-radius:50%;background:#3498db;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-end}#chat-send:disabled{background:#b0bec5;cursor:not-allowed}#chat-send svg{width:18px;height:18px;fill:#fff}@media(max-width:768px){#chat-window{bottom:0;right:0;left:0;top:0;width:100%;height:100%;border-radius:0}#chat-fab{bottom:16px;right:16px}}</style><button id="chat-fab" aria-label="Open chat"><svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H5.2L4 17.2V4h16v12z"/><path d="M7 9h10v2H7zm0-3h10v2H7zm0 6h7v2H7z"/></svg></button><div id="chat-window"><div id="chat-bar"><span>Помічник</span><span class="close-hint">тап — згорнути</span></div><div id="chat-messages"></div><div id="chat-input-area"><textarea id="chat-input" rows="1" placeholder="Напишіть повідомлення..."></textarea><button id="chat-send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button></div></div><script>(function(){'use strict';const MAX_MESSAGES=10,STORAGE_KEY='mij_servak_chat_history',fab=document.getElementById('chat-fab'),win=document.getElementById('chat-window'),bar=document.getElementById('chat-bar'),msgs=document.getElementById('chat-messages'),input=document.getElementById('chat-input'),sendBtn=document.getElementById('chat-send');let chatHistory=[],pending=false,dragState=null,preventClick=false,touchTarget=null;function loadHistory(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)chatHistory=JSON.parse(r)}catch(e){chatHistory=[]}chatHistory.forEach(function(m){appendMsgDOM(m.role,m.content)});scrollDown()}function saveHistory(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(chatHistory))}catch(e){}}function appendMsgDOM(role,content){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=content;msgs.appendChild(d)}function scrollDown(){msgs.scrollTop=msgs.scrollHeight}function trimMessages(){while(chatHistory.length>MAX_MESSAGES){chatHistory.shift()}while(msgs.children.length>MAX_MESSAGES){msgs.removeChild(msgs.firstChild)}saveHistory()}function openChat(){win.classList.add('open');fab.classList.add('hidden');setTimeout(function(){input.focus()},300)}function closeChat(){win.classList.remove('open');fab.classList.remove('hidden')}function initDrag(){fab.addEventListener('mousedown',dragStartFab);fab.addEventListener('touchstart',dragStartFabTouch,{passive:false});bar.addEventListener('mousedown',dragStartBar);bar.addEventListener('touchstart',dragStartBarTouch,{passive:false});document.addEventListener('mousemove',dragMove);document.addEventListener('mouseup',dragEnd);document.addEventListener('touchmove',dragMoveTouch,{passive:false});document.addEventListener('touchend',dragEnd)}function dragStartFab(e){e.preventDefault();preventClick=false;const r=fab.getBoundingClientRect();dragState={el:fab,ox:e.clientX-r.left,oy:e.clientY-r.top,startX:e.clientX,startY:e.clientY};fab.style.right='auto';fab.style.bottom='auto';fab.style.left=r.left+'px';fab.style.top=r.top+'px'}function dragStartFabTouch(e){if(e.touches.length!==1)return;e.preventDefault();preventClick=false;touchTarget='fab';const t=e.touches[0],r=fab.getBoundingClientRect();dragState={el:fab,ox:t.clientX-r.left,oy:t.clientY-r.top,startX:t.clientX,startY:t.clientY};fab.style.right='auto';fab.style.bottom='auto';fab.style.left=r.left+'px';fab.style.top=r.top+'px'}function dragStartBar(e){if(window.innerWidth<=768)return;e.preventDefault();preventClick=false;const r=win.getBoundingClientRect();dragState={el:win,ox:e.clientX-r.left,oy:e.clientY-r.top,startX:e.clientX,startY:e.clientY};win.style.right='auto';win.style.bottom='auto';win.style.left=r.left+'px';win.style.top=r.top+'px'}function dragStartBarTouch(e){if(window.innerWidth<=768)return;if(e.touches.length!==1)return;e.preventDefault();preventClick=false;touchTarget='bar';const t=e.touches[0],r=win.getBoundingClientRect();dragState={el:win,ox:t.clientX-r.left,oy:t.clientY-r.top,startX:t.clientX,startY:t.clientY};win.style.right='auto';win.style.bottom='auto';win.style.left=r.left+'px';win.style.top=r.top+'px'}function dragMove(e){if(!dragState)return;e.preventDefault();var dx=e.clientX-dragState.startX,dy=e.clientY-dragState.startY;if(Math.abs(dx)>4||Math.abs(dy)>4)preventClick=true;dragState.el.style.left=(e.clientX-dragState.ox)+'px';dragState.el.style.top=(e.clientY-dragState.oy)+'px'}function dragMoveTouch(e){if(!dragState||e.touches.length!==1)return;e.preventDefault();var t=e.touches[0],dx=t.clientX-dragState.startX,dy=t.clientY-dragState.startY;if(Math.abs(dx)>4||Math.abs(dy)>4)preventClick=true;dragState.el.style.left=(t.clientX-dragState.ox)+'px';dragState.el.style.top=(t.clientY-dragState.oy)+'px'}function dragEnd(){if(dragState&&!preventClick&&touchTarget){if(touchTarget==='fab')openChat();else if(touchTarget==='bar')closeChat()}dragState=null;touchTarget=null}fab.addEventListener('click',function(e){if(preventClick){e.preventDefault();e.stopPropagation();return}openChat()});bar.addEventListener('click',function(e){if(preventClick){e.preventDefault();e.stopPropagation();return}closeChat()});input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'});function sendMessage(){const text=input.value.trim().replace(/[\x01-\x1f]/g,' ');if(!text||pending)return;pending=true;sendBtn.disabled=true;var pageId=window.location.pathname;var historyJson=JSON.stringify(chatHistory.filter(function(m){return m.role==='user'||m.role==='assistant'}).map(function(m){return{role:m.role,content:stripHtml(m.content)}}));var body='user_mess='+encodeURIComponent(text)+'&chat_history='+encodeURIComponent(historyJson)+'&page='+encodeURIComponent(pageId);appendMsgDOM('user',escapeHtml(text));chatHistory.push({role:'user',content:escapeHtml(text)});trimMessages();scrollDown();input.value='';input.style.height='auto';fetch('/ai-assist-chat-api',{method:'PUT',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}).then(function(r){return r.text()}).then(function(html){appendMsgDOM('assistant',html);chatHistory.push({role:'assistant',content:html});trimMessages();scrollDown()}).catch(function(err){appendMsgDOM('error','Помилка: '+escapeHtml(err.message));trimMessages();scrollDown()}).finally(function(){pending=false;sendBtn.disabled=false;input.focus()})}sendBtn.addEventListener('click',sendMessage);input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});function escapeHtml(str){var d=document.createElement('div');d.appendChild(document.createTextNode(str));return d.innerHTML}function stripHtml(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent||d.innerText||""}initDrag();loadHistory()})();</script>
