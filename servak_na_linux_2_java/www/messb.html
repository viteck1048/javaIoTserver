<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Prompt</title>
    <style>
        /* Стилі для модального вікна */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }
        input {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <button onclick="showPrompt()">Введіть код</button>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <p>Введіть 4-значний код:</p>
            <input id="codeInput" type="text" pattern="\d{4}" required>
            <br>
            <button onclick="submitCode()">OK</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        function showPrompt() {
            document.getElementById("myModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }

        function submitCode() {
            const input = document.getElementById("codeInput");
            if (input.checkValidity()) {
                alert("Ви ввели код: " + input.value);
                closeModal();
            } else {
                alert("Будь ласка, введіть 4-значний код.");
            }
        }
    </script>
</body>
</html>
