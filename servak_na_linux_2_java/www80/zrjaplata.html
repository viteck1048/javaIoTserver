		// Function to convert HH:MM time to seconds since midnight
        function timeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 3600 + minutes * 60;
        }

        // Function to convert seconds to HH:MM format
        function secondsToTime(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
        }

		function getDayOfWeek(day, month, year) {
			const daysOfWeek = [
				{ name: "неділя", number: 7 },
				{ name: "понеділок", number: 1 },
				{ name: "вівторок", number: 2 },
				{ name: "середа", number: 3 },
				{ name: "четвер", number: 4 },
				{ name: "п’ятниця", number: 5 },
				{ name: "субота", number: 6 }
			];

			const date = new Date(year, month - 1, day);
			const dayIndex = date.getDay();

			return daysOfWeek[dayIndex];
		}
		
		function getMonthNumber(monthName) {

				'Травень': '05', 'Червень': '06', 'Липень': '07', 'Серпень': '08',
				'Вересень': '09', 'Жовтень': '10', 'Листопад': '11', 'Грудень': '12'
			};
			return months[monthName] || '00';
		}

		function getMonth(month, year) {

				"Травень",
				"Червень",

				"Серпень",
				"Вересень",
				"Жовтень",
				"Листопад",
				"Грудень"
			];
			return monthName[month - 1] + " " + year + " року";
		}
		
		async function fetchWithTimeout(resource, options = {}) {
			const { timeout = 5000 } = options;
			const controller = new AbortController();
			const id = setTimeout(() => controller.abort(), timeout);
			
			try {
				const response = await fetch(resource, {
					...options,
					signal: controller.signal  
				});
				clearTimeout(id);
				return response;
			} catch (error) {
				clearTimeout(id);
				throw error;
			}
		}

			const selectedCurrency = currencySelect.value;
			if (selectedCurrency === 'EUR') {
				rateInfoSpan.textContent = '';
				rateInfoSpan.className = '';
				return;
			}
			
			const rate = exchangeRates[selectedCurrency];
			if (rate) {
				rateInfoSpan.textContent = ` (1 EUR = ${rate.toFixed(4)} ${selectedCurrency})`;
				rateInfoSpan.className = '';
			} else {
				rateInfoSpan.textContent = ' (не вдалося оновити курс)';
				rateInfoSpan.className = 'outdated-rate';
			}
		}
		
		function convertFromEUR(amount, currency) {
			if (currency === 'EUR') return amount;
			const rate = exchangeRates[currency] || 1;
			return amount * rate;
		}
		
		function formatCurrency(amount, currency) {
			const symbol = currencySymbols[currency] || '';
			const converted = convertFromEUR(amount, currency);
			// Special handling for JPY (no decimals)
			const decimals = currency === 'JPY' ? 0 : 2;
			return `${converted.toFixed(decimals)} ${symbol}`;
		}
		let days = Array(31).fill(null).map(() => ({ alarm: 1, subtime: 0, pod: [], br: 0, DtoW: { name: "none", number: 0 } }));
		function analyzeCSV() {
			const fileInput = document.getElementById('fileInput');
			const resultsDiv = document.getElementById('results');
			const dataStr = document.getElementById('date');
			const personStr = document.getElementById('pers_name');
			days = Array(31).fill(null).map(() => ({ alarm: 1, subtime: 0, pod: [], br: 0, DtoW: { name: "none", number: 0 } }));
			
			if (!fileInput.files.length) {
	//            alert("Будь ласка, виберіть CSV файл.");
				return;
			}

			const file = fileInput.files[0];
			const reader = new FileReader();
			reader.onload = function(event) {
				const csvData = event.target.result;
				const lines = csvData.split('\n').map(line => line.split(';'));
//				const days = Array(31).fill(null).map(() => ({ alarm: 1, subtime: 0, pod: [], br: 0, DtoW: { name: "none", number: 0 } }));
						
				personStr.innerHTML = lines[1][3].slice(1, -1);
				const dateMonth = lines[1][0].slice(1, -1).split(' ')[0].split('-');
				const monthYear = getMonth(dateMonth[1], dateMonth[0]);
				dataStr.innerHTML = monthYear;
				
				// Load vacation days for this month/year
				const monthName = monthYear.split(' ')[0];
				const year = monthYear.split(' ')[1];
				const key = `vacation_${year}_${getMonthNumber(monthName)}`;
				const savedVacationDays = localStorage.getItem(key);
				if (savedVacationDays !== null) {
					vacationDaysInput.value = savedVacationDays;
				} else {
					vacationDaysInput.value = '0';
				}
				
				let headerProcessed = false;
				for (let line of lines) {
					if (!headerProcessed) {
						headerProcessed = true;
						continue;
					}

					if (line.length < 7 || !line[0].startsWith('"')) continue;

					const dateTimeStr = line[0].slice(1, -1);
					const action = line[6].slice(1, -1).includes("ВХОД") ? 1 : 0;
					const dateParts = dateTimeStr.split(' ')[0].split('-');
					const timeParts = dateTimeStr.split(' ')[1].split(':');

					const day = parseInt(dateParts[2]) - 1;
					const timeInSeconds = parseInt(timeParts[0]) * 3600 + parseInt(timeParts[1]) * 60 + parseInt(timeParts[2]);

					days[day].DtoW = getDayOfWeek(dateParts[2], dateParts[1], dateParts[0]);

					days[day].pod.push({ inout: action, time: timeInSeconds });
					days[day].br++;
				}

				let totalTime = 0;
				for (let i = 0; i < days.length; i++) {
					days[i].alarm = 0;
					days[i].subtime = 0;
					
					// Skip if no time entries
					if (days[i].br === 0) continue;
					
					// Get work and lunch times from localStorage or use defaults
					const workStart = parseInt(localStorage.getItem('workStartSeconds')) || STRT_RAB;
					const workEnd = parseInt(localStorage.getItem('workEndSeconds')) || END_RAB;
					const lunchStart = parseInt(localStorage.getItem('lunchStartSeconds')) || STRT_OBID;
					const lunchEnd = parseInt(localStorage.getItem('lunchEndSeconds')) || END_OBID;
					
					// Get first and last time entries
					const firstEntry = days[i].pod[0].time;
					const lastEntry = days[i].pod[days[i].br - 1].time;
					
					// Check if it's a workday (Monday=1, Sunday=7)
					const isWorkday = days[i].DtoW.number <= 5;
					
					let startWork, endWork;
					
					if (isWorkday) {
						// For workdays: start is max of first entry or work start, end is last entry
						startWork = Math.max(firstEntry, workStart);
						endWork = lastEntry;
						
						// If end work is after work end, it's overtime (count it by default)
						if (endWork > workEnd + 1800) {
							// Optionally add a note about overtime
							days[i].note = `Перепрацювання: ${Math.floor((endWork - workEnd) / 3600)} год ${Math.floor(((endWork - workEnd) % 3600) / 60)} хв`;
						}
						
						// Calculate working time with lunch break handling
						if (startWork < lunchStart && endWork > lunchEnd) {
							// If work period covers the entire lunch break
							days[i].subtime = (endWork - startWork) - (lunchEnd - lunchStart);
						} else if (startWork < lunchEnd && endWork > lunchStart) {
							// If work period partially overlaps with lunch break
							const workSeconds = new Array(24 * 60 * 60).fill(0);
							
							// Mark working seconds (from startWork to endWork)
							for (let sec = startWork; sec < endWork; sec++) {
								if (sec >= 0 && sec < workSeconds.length) {
									workSeconds[sec] = 1;
								}
							}
							
							// Unmark lunch break seconds
							for (let sec = lunchStart; sec < lunchEnd; sec++) {
								if (sec >= 0 && sec < workSeconds.length) {
									workSeconds[sec] = 0;
								}
							}
							
							// Count remaining working seconds
							days[i].subtime = workSeconds.reduce((sum, val) => sum + val, 0);
						} else {
							// No lunch break in work period
							days[i].subtime = endWork - startWork;
						}
					} else {
						// For weekends: simple calculation from first to last entry
						startWork = firstEntry;
						endWork = lastEntry;
						days[i].subtime = endWork - startWork;
						days[i].note = "Вихідний";
					}
					days[i].startWork = startWork;
					days[i].endWork = endWork;
					// Add to total time if work time is positive
					if (days[i].subtime > 0) {
						totalTime += days[i].subtime;
					}
				}

				let totalHours = Math.floor(totalTime / 3600);
				let totalMinutes = Math.floor((totalTime % 3600) / 60);
				// Calculate in EUR
				const hourlyRateInEUR = valuesInEUR.hourlyRate;
				const vacationRateInEUR = valuesInEUR.vacationRate;
				const totalSalary = (totalTime / 3600 * hourlyRateInEUR).toFixed(2);
				const vacationPay = (vacationRateInEUR * vacationDaysInput.value).toFixed(2);
				let resultHTML = `
					<table border="1">
						<tr>
							<th>#</th>
							<th>День</th>
							<th>Початок</th>
							<th>Кінець</th>
							<th>Час</th>
							<th>Сума</th>
							<th>Зауваження</th>
						</tr>`;

					days.forEach((day, index) => {
						if (day.br > 0) {
							const defaultStart = parseInt(localStorage.getItem('workStartSeconds')) || STRT_RAB;
							const defaultEnd = parseInt(localStorage.getItem('workEndSeconds')) || END_RAB;
							
							const startTime = day.startWork !== undefined ? secondsToTime(day.startWork) : secondsToTime(defaultStart);
							const endTime = day.endWork !== undefined ? secondsToTime(day.endWork) : secondsToTime(defaultEnd);
							
							resultHTML += `
							<tr>
								<td>${index + 1}</td>
								<td>${day.DtoW.name}</td>
								<td><input type="time" value="${startTime}" onblur="handleTimeChange(${index}, 'start', this.value, event)" oninput="handleTimeChange(${index}, 'start', this.value, event)" style="width: 80px;"></td>
								<td><input type="time" value="${endTime}" onblur="handleTimeChange(${index}, 'end', this.value, event)" oninput="handleTimeChange(${index}, 'end', this.value, event)" style="width: 80px;"></td>
								<td>${Math.floor(day.subtime / 3600)}:${String(Math.floor((day.subtime % 3600) / 60)).padStart(2, '0')}</td>
								<td>${formatCurrency(day.subtime / 3600 * valuesInEUR.hourlyRate, currencySelect.value)}</td>`;
							
							if (day.br == 1) {
								resultHTML += `<td style="color: red; font-weight: bold;">!!! ПОМИЛКА !!!</td>`;
							} else {
								resultHTML += `<td>${day.note || ''}</td>`;
							}
							
							resultHTML += "</tr>";
						}
					});
					
					// Add total row
					//let totalSalary = formatCurrency(totalTime / 3600 * valuesInEUR.hourlyRate, currencySelect.value);
									// Add total row
			//	const totalHours = Math.floor(totalTime / 3600);
			//	const totalMinutes = Math.floor((totalTime % 3600) / 60);
				const totalSalaryEUR = valuesInEUR.hourlyRate * (totalTime / 3600);
				const bonusEUR = valuesInEUR.bonus;
				const vacationPayEUR = valuesInEUR.vacationRate * parseFloat(vacationDaysInput.value);
				const advanceEUR = valuesInEUR.advance;
				
				resultHTML += `</tbody>
					</table>
					<p>Загальний час: ${totalHours}:${String(totalMinutes).padStart(2, '0')}</p>
					<p>Загальна ставка: ${formatCurrency(totalSalaryEUR, currencySelect.value)}</p>
					<p>+ премія: ${formatCurrency(bonusEUR, currencySelect.value)}</p>
					<p>+ відпускні: ${formatCurrency(vacationPayEUR, currencySelect.value)} (${formatCurrency(valuesInEUR.vacationRate, currencySelect.value)} × ${vacationDaysInput.value} дн.)</p>
					<p>Аванс: ${formatCurrency(advanceEUR, currencySelect.value)}</p>
					<p>До сплати: ${formatCurrency(totalSalaryEUR + bonusEUR + vacationPayEUR - advanceEUR, currencySelect.value)}</p>`;

				resultsDiv.innerHTML = resultHTML;
					document.getElementById('results').innerHTML = resultHTML;
				};
				
				reader.readAsText(file, 'windows-1251');
			}
			
			// Function to handle time input changes
			function handleTimeChange(dayIndex, type, value, event) {
				// If this is a blur event, update the results
				if (event && event.type === 'blur') {
					const seconds = timeToSeconds(value);
					const day = days[dayIndex];
					
					// Update the day's work times
					if (type === 'start') {
						day.customStart = seconds;
					} else {
						day.customEnd = seconds;
					}
					
					// Recalculate the day's working time
					calculateDayWorkTime(day);
					
					// Update the total time
					totalTime = days.reduce((sum, d) => sum + (d.subtime || 0), 0);
					
					// Update the table
					updateResultsTable();
				}
				// For input events, just update the model but don't recalculate yet
				else if (event && event.type === 'input') {
					const seconds = timeToSeconds(value);
					if (type === 'start') {
						days[dayIndex].customStart = seconds;
					} else {
						days[dayIndex].customEnd = seconds;
					}
				}
			}
			
			// Function to calculate work time for a day
			function calculateDayWorkTime(day) {
				if (day.br === 0) {
					day.subtime = 0;
					return;
				}
				
				const workStart = day.customStart !== undefined ? day.customStart : (parseInt(localStorage.getItem('workStartSeconds')) || STRT_RAB);
				const workEnd = day.customEnd !== undefined ? day.customEnd : (parseInt(localStorage.getItem('workEndSeconds')) || END_RAB);
				const lunchStart = parseInt(localStorage.getItem('lunchStartSeconds')) || STRT_OBID;
				const lunchEnd = parseInt(localStorage.getItem('lunchEndSeconds')) || END_OBID;
				
				const firstEntry = day.pod[0].time;
				const lastEntry = day.pod[day.pod.length - 1].time;
				
				const isWorkday = day.DtoW.number <= 5;
				
				let startWork, endWork;
				
				if (isWorkday) {
					startWork = Math.max(firstEntry, workStart);
					endWork = Math.max(lastEntry, startWork);
					
					if (endWork > workEnd + 1800) {
						day.note = `Перепрацювання: ${Math.floor((endWork - workEnd) / 3600)} год ${Math.floor(((endWork - workEnd) % 3600) / 60)} хв`;
					} else {
						day.note = '';
					}
					
					if (startWork < lunchStart && endWork > lunchEnd) {
						day.subtime = (endWork - startWork) - (lunchEnd - lunchStart);
					} else if (startWork < lunchEnd && endWork > lunchStart) {
						const workSeconds = new Array(24 * 60 * 60).fill(0);
						
						for (let sec = startWork; sec < endWork; sec++) {
							if (sec >= 0 && sec < workSeconds.length) workSeconds[sec] = 1;
						}
						
						for (let sec = lunchStart; sec < lunchEnd; sec++) {
							if (sec >= 0 && sec < workSeconds.length) workSeconds[sec] = 0;
						}
						
						day.subtime = workSeconds.reduce((sum, val) => sum + val, 0);
					} else {
						day.subtime = endWork - startWork;
					}
				} else {
					startWork = firstEntry;
					endWork = lastEntry;
					day.subtime = endWork - startWork;
					day.note = "Вихідний";
				}
				
			}
			
			// Function to update the results table
			function updateResultsTable() {
				// Recalculate total time
				let totalTime = 0;
				days.forEach((day, index) => {
					let startWork, endWork;
					const isWorkday = days[index].DtoW.number <= 5;
					// Find the row by day number in the first column
					const dayNumber = index + 1;
					const row = Array.from(document.querySelectorAll('#results table tbody tr')).find(tr => {
						const firstCell = tr.querySelector('td:first-child');
						return firstCell && firstCell.textContent.trim() === dayNumber.toString();
					});
					
					if (!row) return;
					
					// Get the time inputs from the row
					const startInput = row.querySelector('td:nth-child(3) input[type="time"]');
					const endInput = row.querySelector('td:nth-child(4) input[type="time"]');
					if (!startInput || !endInput) {
						return;
					}
					// Convert input values to seconds
					startWork = timeToSeconds(startInput.value);
					endWork = timeToSeconds(endInput.value);
					//console.log(index + 1, startWork, endWork);
					if (isWorkday) {
						// Get start and end times from the table inputs
						workEnd = localStorage.getItem('workEndSeconds');
						lunchStart = localStorage.getItem('lunchStartSeconds');
						lunchEnd = localStorage.getItem('lunchEndSeconds');
						// If end work is after work end, it's overtime (count it by default)
						if (endWork > workEnd + 1800) {
							// Optionally add a note about overtime
							days[index].note = `Перепрацювання: ${Math.floor((endWork - workEnd) / 3600)} год ${Math.floor(((endWork - workEnd) % 3600) / 60)} хв`;
						}
						else
							days[index].note = '';

						// Calculate working time with lunch break handling
						if (startWork < lunchStart && endWork > lunchEnd) {
							// If work period covers the entire lunch break
							days[index].subtime = (endWork - startWork) - (lunchEnd - lunchStart);
						} else if (startWork < lunchEnd && endWork > lunchStart) {
							// If work period partially overlaps with lunch break
							const workSeconds = new Array(24 * 60 * 60).fill(0);
							
							// Mark working seconds (from startWork to endWork)
							for (let sec = startWork; sec < endWork; sec++) {
								if (sec >= 0 && sec < workSeconds.length) {
									workSeconds[sec] = 1;
								}
							}
							
							// Unmark lunch break seconds
							for (let sec = lunchStart; sec < lunchEnd; sec++) {
								if (sec >= 0 && sec < workSeconds.length) {
									workSeconds[sec] = 0;
								}
							}
							
							// Count remaining working seconds
							days[index].subtime = workSeconds.reduce((sum, val) => sum + val, 0);
						} else {
							// No lunch break in work period
							days[index].subtime = endWork - startWork;
						}
					} else {
						// For weekends: simple calculation from first to last entry
						days[index].subtime = endWork - startWork;
						days[index].note = "Вихідний";
					}
					days[index].startWork = startWork;
					days[index].endWork = endWork;
					// Add to total time if work time is positive
					if (days[index].subtime > 0) {
						totalTime += days[index].subtime;
					}
				});
				
				totalTime = days.reduce((sum, day) => sum + (day.subtime || 0), 0);
				
				let html = `<table border="1">
					<tr>
						<th>#</th>
						<th>День</th>
						<th>Початок</th>
						<th>Кінець</th>
						<th>Час</th>
						<th>Сума</th>
						<th>Зауваження</th>
					</tr>`;
				
				days.forEach((day, index) => {
					if (day.br > 0) {
						const defaultStart = parseInt(localStorage.getItem('workStartSeconds')) || STRT_RAB;
						const defaultEnd = parseInt(localStorage.getItem('workEndSeconds')) || END_RAB;
						
						const startTime = day.startWork !== undefined ? secondsToTime(day.startWork) : secondsToTime(defaultStart);
						const endTime = day.endWork !== undefined ? secondsToTime(day.endWork) : secondsToTime(defaultEnd);
						
						html += `
						<tr>
							<td>${index + 1}</td>
							<td>${day.DtoW.name}</td>
							<td><input type="time" value="${startTime}" onchange="handleTimeChange(${index}, 'start', this.value)" style="width: 80px;"></td>
							<td><input type="time" value="${endTime}" onchange="handleTimeChange(${index}, 'end', this.value)" style="width: 80px;"></td>
							<td>${Math.floor(day.subtime / 3600)}:${String(Math.floor((day.subtime % 3600) / 60)).padStart(2, '0')}</td>
							<td>${formatCurrency(day.subtime / 3600 * valuesInEUR.hourlyRate, currencySelect.value)}</td>`;
						
						if (day.br == 1) {
							html += `<td style="color: red; font-weight: bold;">!!! ПОМИЛКА !!!</td>`;
						} else {
							html += `<td>${day.note || ''}</td>`;
						}
						
						html += "</tr>";
					}
				});
				
				// Add total row
				const totalHours = Math.floor(totalTime / 3600);
				const totalMinutes = Math.floor((totalTime % 3600) / 60);
				const totalSalary = formatCurrency(totalTime / 3600 * valuesInEUR.hourlyRate, currencySelect.value);
				// We'll use the values directly from valuesInEUR which are stored in EUR
				const totalSalaryEUR = valuesInEUR.hourlyRate * (totalTime / 3600);
				const bonusEUR = valuesInEUR.bonus;
				const vacationPayEUR = valuesInEUR.vacationRate * parseFloat(vacationDaysInput.value);
				const advanceEUR = valuesInEUR.advance;
				
				let resultHTML = html + `</tbody>
					</table>
					<p>Загальний час: ${totalHours}:${String(totalMinutes).padStart(2, '0')}</p>
					<p>Загальна ставка: ${formatCurrency(totalSalaryEUR, currencySelect.value)}</p>
					<p>+ премія: ${formatCurrency(bonusEUR, currencySelect.value)}</p>
					<p>+ відпускні: ${formatCurrency(vacationPayEUR, currencySelect.value)} (${formatCurrency(valuesInEUR.vacationRate, currencySelect.value)} × ${vacationDaysInput.value} дн.)</p>
					<p>Аванс: ${formatCurrency(advanceEUR, currencySelect.value)}</p>
					<p>До сплати: ${formatCurrency(totalSalaryEUR + bonusEUR + vacationPayEUR - advanceEUR, currencySelect.value)}</p>`;

				document.getElementById('results').innerHTML = resultHTML;
			};
			
			
		updateInputValues();
	</script>
