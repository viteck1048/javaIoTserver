<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обчислення</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Изчисления на теглото на медта в кабела</h1>
        <p>Избери параметра:</p>
        <label><input type="radio" name="option" value="1"> диаметр на жицата (мм)</label>
        <label><input type="radio" name="option" value="2"> площ на сечението (мм²)</label>
        
        <div id="input-diam" style="display:block;">
            <label for="diam">d (мм):</label>
            <input type="number" id="diam" step="0.01" disabled>
        </div>
		
        
		<div id="input-sech" style="display:block;">
            <label for="sech">S (мм²):</label>
            <input type="number" id="sech" step="0.01" disabled>
        </div>
        
        <label for="kilk">Брой жици:</label>
        <input type="number" id="kilk" step="1">
        
        <label for="dowzh">Дьлжина (м):</label>
        <input type="number" id="dowzh" step="0.1">
        
        <button onclick="calculate()">Изчисли</button>
        
        <p id="result"></p>
    </div>
    
    <script>
        document.querySelectorAll('input[name="option"]').forEach((elem) => {
            elem.addEventListener("change", function(event) {
                if (event.target.value === "2") {
                    document.getElementById("diam").disabled = true;
                    document.getElementById("sech").disabled = false;
                } else {
                    document.getElementById("diam").disabled = false;
                    document.getElementById("sech").disabled = true;
                }
            });
        });

        function calculate() {
            let option = document.querySelector('input[name="option"]:checked').value;
            let diam, sech, dowzh, kilk, tehl;
            
            if (option === "1") {
                diam = parseFloat(document.getElementById("diam").value);
                sech = (diam * diam * Math.PI) / 4;
				document.getElementById("sech").value = sech.toFixed(3);
            } else {
                sech = parseFloat(document.getElementById("sech").value);
				diam = Math.sqrt(sech * 4 / Math.PI);
				document.getElementById("diam").value = diam.toFixed(3);
            }
            
            kilk = parseFloat(document.getElementById("kilk").value);
            dowzh = parseFloat(document.getElementById("dowzh").value);
            sech *= 0.000001;
            sech = sech * dowzh * kilk;
            tehl = sech * 8960;
            
            document.getElementById("result").innerText = "Тегло (кг): " + tehl.toFixed(3);
        }
    </script>
</body>
</html>
