<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналіз CSV файлу</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        input[type="file"] {
            display: block;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div>
        <label>
            Погодинна ставка (BGN):
            <input type="number" id="hourlyRate" step="0.01" value="13">
        </label>
        <br>
        <label>
            Аванс (BGN):
            <input type="number" id="advance" step="0.01" value="741.80">
        </label>
        <br>
        <label>
            Премія (BGN):
            <input type="number" id="bonus" step="0.01" value="300">
        </label>
    </div>
	<div class="container">
        <h1>Аналіз CSV файлу</h1>
        <input type="file" id="fileInput" accept=".csv">
        <!--button onclick="analyzeCSV()">Аналізувати</button-->
        <h2 id='pers_name'></h2>
		<h3 id='date'></h2>
		<div id="results"></div>
    </div>

    <script>
        
		document.getElementById('fileInput').addEventListener('change', () => {
			analyzeCSV();
		});

		const STRT_RAB = 7 * 3600 + 50 * 60;
        const STRT_OBID = 11 * 3600 + 40 * 60;
        const END_OBID = 12 * 3600 + 20 * 60;
        const END_RAB = 16 * 3600 + 40 * 60;
		
		const hourlyRateInput = document.getElementById('hourlyRate');
        const advanceInput = document.getElementById('advance');
        const bonusInput = document.getElementById('bonus');
		
		hourlyRateInput.addEventListener('input', () => {
			localStorage.setItem('hourlyRate', hourlyRateInput.value || 1);
			analyzeCSV();
		});
		advanceInput.addEventListener('input', () => {
			localStorage.setItem('advance', advanceInput.value || 0);
			analyzeCSV();
		});
		bonusInput.addEventListener('input', () => {
			localStorage.setItem('bonus', bonusInput.value || 0);
			analyzeCSV();
		});
		
        hourlyRateInput.value = localStorage.getItem('hourlyRate') || 10;
        advanceInput.value = localStorage.getItem('advance') || 0;
        bonusInput.value = localStorage.getItem('bonus') || 0;
		
        function getDayOfWeek(day, month, year) {
            const daysOfWeek = [
                { name: "неділя", number: 7 },
                { name: "понеділок", number: 1 },
                { name: "вівторок", number: 2 },
                { name: "середа", number: 3 },
                { name: "четвер", number: 4 },
                { name: "п’ятниця", number: 5 },
                { name: "субота", number: 6 }
            ];

            const date = new Date(year, month - 1, day);
            const dayIndex = date.getDay();

            return daysOfWeek[dayIndex];
        }
        
		function getMonth(month, year) {
			const monthName = [
				"Січень",
				"Лютий",
				"Березень",
				"Квітень",
				"Травень",
				"Червень",
				"Липень",
				"Серпень",
				"Вересень",
				"Жовтень",
				"Листопад",
				"Грудень"
			];
			return monthName[month - 1] + " " + year + " року";
		}
		
		function analyzeCSV() {
            const fileInput = document.getElementById('fileInput');
            const resultsDiv = document.getElementById('results');
            const dataStr = document.getElementById('date');
            const personStr = document.getElementById('pers_name');
            
			if (!fileInput.files.length) {
    //            alert("Будь ласка, виберіть CSV файл.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const csvData = event.target.result;
                const lines = csvData.split('\n').map(line => line.split(';'));
                const days = Array(31).fill(null).map(() => ({ alarm: 1, subtime: 0, pod: [], br: 0, DtoW: { name: "none", number: 0 } }));
						
				personStr.innerHTML = lines[1][3].slice(1, -1);
				const dateMonth = lines[1][0].slice(1, -1).split(' ')[0].split('-');
				dataStr.innerHTML = getMonth(dateMonth[1], dateMonth[0]);
				
                let headerProcessed = false;
                for (let line of lines) {
                    if (!headerProcessed) {
                        headerProcessed = true;
                        continue;
                    }

                    if (line.length < 7 || !line[0].startsWith('"')) continue;

                    const dateTimeStr = line[0].slice(1, -1);
                    const action = line[6].slice(1, -1).includes("ВХОД") ? 1 : 0;
                    const dateParts = dateTimeStr.split(' ')[0].split('-');
                    const timeParts = dateTimeStr.split(' ')[1].split(':');

                    const day = parseInt(dateParts[2]) - 1;
                    const timeInSeconds = parseInt(timeParts[0]) * 3600 + parseInt(timeParts[1]) * 60 + parseInt(timeParts[2]);

                    days[day].DtoW = getDayOfWeek(dateParts[2], dateParts[1], dateParts[0]);

                    days[day].pod.push({ inout: action, time: timeInSeconds });
                    days[day].br++;
                }

                let totalTime = 0;
                for (let i = 0; i < days.length; i++) {
                    let ff = 0;
                    days[i].alarm = 0;
                    switch (days[i].br) {
                        case 2:
                            if (days[i].pod[0].inout === 1 && days[i].pod[1].inout === 0) days[i].alarm = 0;
                            days[i].subtime = days[i].pod[1].time - days[i].pod[0].time;
                            ff = 1;
                            break;
                        case 3:
                            days[i].subtime = days[i].pod[2].time - days[i].pod[0].time;
                            ff = 1;
                            break;
                        case 4:
                            if (days[i].pod[0].inout === 1 && days[i].pod[1].inout === 0 && days[i].pod[2].inout === 1 && days[i].pod[3].inout === 0)
                                days[i].alarm = 0;
                            days[i].subtime = days[i].pod[3].time - days[i].pod[2].time + days[i].pod[1].time - days[i].pod[0].time;
                            if (days[i].subtime < (days[i].pod[2].time - days[i].pod[1].time) || days[i].alarm === 1) {
                                days[i].subtime = days[i].pod[3].time - days[i].pod[0].time;
                            }
                            if (!((days[i].pod[1].time > STRT_OBID && days[i].pod[1].time < END_OBID) || (days[i].pod[2].time > STRT_OBID && days[i].pod[2].time < END_OBID))) {
                                ff = 1;
                            }
                            days[i].alarm = 1;
                            break;
                    }

                    if (ff === 1) {
                        if (days[i].DtoW.number <= 5) {
                            days[i].subtime -= 40 * 60;
                        }
                        totalTime += days[i].subtime;
                    }
                }

                let totalHours = Math.floor(totalTime / 3600);
                let totalMinutes = Math.floor((totalTime % 3600) / 60);
                let totalPayment = totalTime / 3600 * hourlyRateInput.value;
				
                let resultHTML = `<table>
                    <thead>
                        <tr>
                            <th>День</th>
                            <th>День тижня</th>
                            <th>Час</th>
                            <th>Зарплата (BGN)</th>
                            <th>Сигнал</th>
                        </tr>
                    </thead>
                    <tbody>`;

                days.forEach((day, index) => {
					if (day.br > 0) {
						resultHTML += `<tr>
							<td>${index + 1}</td>
							<td>${day.DtoW.name}</td>
							<td>${Math.floor(day.subtime / 3600)}:${String(Math.floor((day.subtime % 3600) / 60)).padStart(2, '0')}</td>
							<td>${(day.subtime / 3600 * hourlyRateInput.value).toFixed(2)}</td>
							<td>${day.alarm ? 'АЛАРМ' : ''}</td>
						</tr>`;
					}
				});

                resultHTML += `</tbody>
                    </table>
                    <p>Загальний час: ${totalHours}:${String(totalMinutes).padStart(2, '0')}</p>
                    <p>Загальна ставка: ${totalPayment.toFixed(2)} BGN</p>
                    <p>Аванс: ${advanceInput.value} BGN</p>
                    <p>Залишок: ${(totalPayment - advanceInput.value).toFixed(2)} BGN</p>
                    <p>+ Премія: ${(totalPayment - advanceInput.value + bonusInput.value * 1).toFixed(2)} BGN</p>`;

                resultsDiv.innerHTML = resultHTML;
            };
			
			reader.readAsText(file, 'windows-1251');
        }
    </script>
</body>
</html>
